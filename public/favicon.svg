<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Fill (Earthy Taupe-Brown) -->
    <linearGradient id="lotoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a08570" />
      <stop offset="100%" stop-color="#8c705b" />
    </linearGradient>

    <!-- Pink Lotus Petal Gradient -->
    <linearGradient id="pinkPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5c2d0" />
      <stop offset="50%" stop-color="#ea9fb2" />
      <stop offset="100%" stop-color="#df7d98" />
    </linearGradient>

    <!-- Center Petal Gradient -->
    <linearGradient id="centerPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8d7e1" />
      <stop offset="100%" stop-color="#ea9fb2" />
    </linearGradient>

    <!-- Green Leaf Base Gradient -->
    <linearGradient id="greenLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#82a677" />
      <stop offset="100%" stop-color="#5a7e50" />
    </linearGradient>
  </defs>

  <!-- Outer White Padding Circle -->
  <circle cx="256" cy="256" r="256" fill="#ffffff" />

  <!-- Outer Forest Green Border Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#lotoBg)" stroke="#2b4c37" stroke-width="24" />

  <!-- White Upper Arching Canopy Lines -->
  <path d="M 120 180 C 130 90, 382 90, 392 180" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  <path d="M 155 140 C 175 75, 337 75, 357 140" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8" />

  <!-- White Lower Arching Cradle Lines -->
  <path d="M 125 330 C 135 420, 377 420, 387 330" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Green Base Leaves -->
  <!-- Left Leaf -->
  <path d="M 256 315 C 190 300 130 325 155 350 C 200 375 256 325 256 315 Z" fill="url(#greenLeaf)" stroke="#2b4c37" stroke-width="6" />
  <!-- Right Leaf -->
  <path d="M 256 315 C 322 300 382 325 357 350 C 312 375 256 325 256 315 Z" fill="url(#greenLeaf)" stroke="#2b4c37" stroke-width="6" />

  <!-- Blooming Lotus Petals (Back to Front) -->
  <!-- Outer Far Left Petal -->
  <path d="M 256 310 C 140 310 110 240 145 200 C 190 230 240 290 256 310 Z" fill="url(#pinkPetal)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Outer Far Right Petal -->
  <path d="M 256 310 C 372 310 402 240 367 200 C 322 230 272 290 256 310 Z" fill="url(#pinkPetal)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

  <!-- Mid Left Petal -->
  <path d="M 256 310 C 170 280 150 180 195 150 C 230 190 250 280 256 310 Z" fill="url(#pinkPetal)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

  <!-- Mid Right Petal -->
  <path d="M 256 310 C 342 280 362 180 317 150 C 282 190 262 280 256 310 Z" fill="url(#pinkPetal)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

  <!-- Center Primary Lotus Petal -->
  <path d="M 256 310 C 210 250 215 130 256 100 C 297 130 302 250 256 310 Z" fill="url(#centerPetal)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Center Petal Inner Leaf Vein Line -->
  <path d="M 256 120 Q 256 220 256 295" fill="none" stroke="#2b4c37" stroke-width="4" stroke-linecap="round" />
</svg>